# Group A 多 Master 仿真拓扑 (GCS_A + UAV1..UAV15)
# 属于 tcp_to_ros 地面站主功能包的联调配置：GCS_A 侧与 UAV* 机载侧
# 都通过通用包 swarm_topology_bridge 的 bridge_node 加载本配置。
#
# 启动方式 (每个 ROS Master 一个终端):
#   export ROS_MASTER_URI=http://localhost:11311
#   roslaunch tcp_to_ros topology_group_a_sim.launch uav_name:=UAV1
#   ...
#   export ROS_MASTER_URI=http://localhost:11310
#   roslaunch tcp_to_ros topology_group_a_sim.launch uav_name:=GCS_A
#   （机载 UAV4 使用 11314，与 GCS_A 11310 分离；端口规划见下方 port_offset）
#
# 端口规划:
#   - Topic PUB:   base_port + topic_idx + port_offset
#   - Service ROUTER: service_base_port + port_offset
#   GCS_A: port_offset=0,  UAV1: port_offset=100, UAV2: port_offset=200, ... UAV15: port_offset=1500
#
# 实机部署: 各 UAV 使用物理 IP 且 port_offset 全为 0。
#
# 命名约定:
#   - 机载 mock/执行适配层发布全局 Topic /uav_task_state (bridge 订阅该名)
#   - 机载提供 /UAV{n}/uav_task 与 /UAV{n}/uav_hold Service
#   - 机载本地 /mavros/state 在 GCS_A 侧转发为 /UAV{n}/mavros/state
#   - GCS_A 侧 bridge 把收到的状态发布为 /UAV{n}/uav_task_state, 供 GCS_A backend 订阅

uavs:
  - {name: GCS_A, ip: 127.0.0.1, port_offset: 0}
  - {name: UAV1, ip: 127.0.0.1, port_offset: 100}
  - {name: UAV2, ip: 127.0.0.1, port_offset: 200}
  - {name: UAV3, ip: 127.0.0.1, port_offset: 300}
  - {name: UAV4, ip: 127.0.0.1, port_offset: 400}
  - {name: UAV5, ip: 127.0.0.1, port_offset: 500}
  - {name: UAV6, ip: 127.0.0.1, port_offset: 600}
  - {name: UAV7, ip: 127.0.0.1, port_offset: 700}
  - {name: UAV8, ip: 127.0.0.1, port_offset: 800}
  - {name: UAV9, ip: 127.0.0.1, port_offset: 900}
  - {name: UAV10, ip: 127.0.0.1, port_offset: 1000}
  - {name: UAV11, ip: 127.0.0.1, port_offset: 1100}
  - {name: UAV12, ip: 127.0.0.1, port_offset: 1200}
  - {name: UAV13, ip: 127.0.0.1, port_offset: 1300}
  - {name: UAV14, ip: 127.0.0.1, port_offset: 1400}
  - {name: UAV15, ip: 127.0.0.1, port_offset: 1500}
  - {name: UAV16, ip: 127.0.0.1, port_offset: 1600}

topics:
  # 单机状态 Topic: 不限频 (控制/状态 Topic 不得被限频丢弃)
  - {name: uav_task_state, type: swarm_uav_interfaces/UavTaskState, max_freq: 0, mode: queue}
  - {name: mavros/state, type: mavros_msgs/State, max_freq: 0, mode: latest}
  - {name: mavros/global_position/global, type: sensor_msgs/NavSatFix, max_freq: 0, mode: latest}
  - {name: mavros/local_position/pose, type: geometry_msgs/PoseStamped, max_freq: 0, mode: latest}
  - {name: gp_origin_confirmed, type: std_msgs/Bool, max_freq: 0, mode: queue}
  # 机间轻量位姿流: FOLLOW_ROUTE follower 订阅 /<leader>/swarm_pose（relay 从 odom 抽位置）
  - {name: swarm_pose, type: geometry_msgs/PointStamped, max_freq: 0, mode: latest}
  - {name: trajectory_intent, type: swarm_uav_interfaces/UavTrajectoryIntent, max_freq: 0, mode: queue}
  # GPS 时钟偏置（本机 bias 均值 1Hz）：桥到 GCS_A 与其他 UAV，接收端修正机间时间戳
  - {name: gps_bias, type: std_msgs/Float64, max_freq: 0, mode: queue}
  # GCS_A 全局原点下发给所有 UAV: 机载 gp_origin_receiver 转发到 /mavros/global_position/set_gp_origin
  - {name: group_a/gp_origin, type: geographic_msgs/GeoPointStamped, max_freq: 0, mode: queue}

max_freq: 0
base_port: 4200

# 跨话题合包（2026-10-12，与生产 topology.yaml 同构）：sim 用 port_offset 区分多节点，
# bundle 端口 = bundle_port + port_offset；packing: legacy 可对照回归（线不兼容，需全队一致）。
packing: bundle
# bundle 传输层：tcp = 现有 ZMQ/TCP；udp = 原始 UDP 单播（去 ACK/重传，全队必须一致）
bundle_transport: tcp
bundle_port: 4200
bundle_tick_hz: 10.0
bundle_max_bytes: 1400
bundle_queue_max: 100

# Topic 桥拓扑: topology[my_name] 表示本机接收这些源的状态 Topic。
# 仅 GCS_A 需要接收所有 UAV 的状态; UAV 之间仅需要 leader 位姿桥接 (FOLLOW_ROUTE),
# 为保证 leader/follower 组在所有批次中可达, 每架 UAV 订阅其余全部 UAV 的 odom。
topology:
  GCS_A: [UAV1, UAV2, UAV3, UAV4, UAV5, UAV6, UAV7, UAV8, UAV9, UAV10, UAV11, UAV12, UAV13, UAV14, UAV15, UAV16]
  UAV1: [GCS_A, UAV2, UAV3, UAV4, UAV5, UAV6, UAV7, UAV8, UAV9, UAV10, UAV11, UAV12, UAV13, UAV14, UAV15, UAV16]
  UAV2: [GCS_A, UAV1, UAV3, UAV4, UAV5, UAV6, UAV7, UAV8, UAV9, UAV10, UAV11, UAV12, UAV13, UAV14, UAV15, UAV16]
