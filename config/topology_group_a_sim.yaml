  UAV5: [GCS_A, UAV1, UAV2, UAV3, UAV4, UAV6, UAV7, UAV8, UAV9, UAV10, UAV11, UAV12, UAV13, UAV14, UAV15, UAV16]
  UAV6: [GCS_A, UAV1, UAV2, UAV3, UAV4, UAV5, UAV7, UAV8, UAV9, UAV10, UAV11, UAV12, UAV13, UAV14, UAV15, UAV16]
  UAV7: [GCS_A, UAV1, UAV2, UAV3, UAV4, UAV5, UAV6, UAV8, UAV9, UAV10, UAV11, UAV12, UAV13, UAV14, UAV15, UAV16]
  UAV8: [GCS_A, UAV1, UAV2, UAV3, UAV4, UAV5, UAV6, UAV7, UAV9, UAV10, UAV11, UAV12, UAV13, UAV14, UAV15, UAV16]
  UAV9: [GCS_A, UAV1, UAV2, UAV3, UAV4, UAV5, UAV6, UAV7, UAV8, UAV10, UAV11, UAV12, UAV13, UAV14, UAV15, UAV16]
  UAV10: [GCS_A, UAV1, UAV2, UAV3, UAV4, UAV5, UAV6, UAV7, UAV8, UAV9, UAV11, UAV12, UAV13, UAV14, UAV15, UAV16]
  UAV11: [GCS_A, UAV1, UAV2, UAV3, UAV4, UAV5, UAV6, UAV7, UAV8, UAV9, UAV10, UAV12, UAV13, UAV14, UAV15, UAV16]
  UAV12: [GCS_A, UAV1, UAV2, UAV3, UAV4, UAV5, UAV6, UAV7, UAV8, UAV9, UAV10, UAV11, UAV13, UAV14, UAV15, UAV16]
  UAV13: [GCS_A, UAV1, UAV2, UAV3, UAV4, UAV5, UAV6, UAV7, UAV8, UAV9, UAV10, UAV11, UAV12, UAV14, UAV15, UAV16]
  UAV14: [GCS_A, UAV1, UAV2, UAV3, UAV4, UAV5, UAV6, UAV7, UAV8, UAV9, UAV10, UAV11, UAV12, UAV13, UAV15, UAV16]
  UAV15: [GCS_A, UAV1, UAV2, UAV3, UAV4, UAV5, UAV6, UAV7, UAV8, UAV9, UAV10, UAV11, UAV12, UAV13, UAV14, UAV16]
  UAV16: [GCS_A, UAV1, UAV2, UAV3, UAV4, UAV5, UAV6, UAV7, UAV8, UAV9, UAV10, UAV11, UAV12, UAV13, UAV14, UAV15]

