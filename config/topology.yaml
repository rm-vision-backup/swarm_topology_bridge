# Group A 实机生产拓扑（implementation_plan_26091101 §4）
# 每台机器启动本机 bridge，按 hostname 判定身份（机载 hostname=UAVn；地面站 hostname=GCS_A）。
# 实机各机独立物理 IP -> 所有节点 port_offset=0；topic 端口=base_port+idx，
# service 端口=service_base_port（4200/14000，已实机验证无冲突，防火墙按此放行）。
# 任务层 Axx 不出现在本文件：bridge 只使用执行层 UAVn。

uavs:
  - {name: GCS_A, ip: 192.168.5.241, port_offset: 0}
  - {name: UAV1, ip: 192.168.5.11, port_offset: 0}
  - {name: UAV2, ip: 192.168.5.21, port_offset: 0}
  - {name: UAV3, ip: 192.168.5.31, port_offset: 0}
  - {name: UAV4, ip: 192.168.5.41, port_offset: 0}
  - {name: UAV5, ip: 192.168.5.51, port_offset: 0}
  - {name: UAV6, ip: 192.168.5.61, port_offset: 0}
  - {name: UAV7, ip: 192.168.5.71, port_offset: 0}
  - {name: UAV8, ip: 192.168.5.81, port_offset: 0}
  - {name: UAV9, ip: 192.168.5.91, port_offset: 0}
  - {name: UAV10, ip: 192.168.5.101, port_offset: 0}
  - {name: UAV11, ip: 192.168.5.111, port_offset: 0}
  - {name: UAV12, ip: 192.168.5.121, port_offset: 0}
  - {name: UAV13, ip: 192.168.5.131, port_offset: 0}
  - {name: UAV14, ip: 192.168.5.141, port_offset: 0}
  - {name: UAV15, ip: 192.168.5.151, port_offset: 0}
  - {name: UAV16, ip: 192.168.5.161, port_offset: 0}

topics:
  - {name: uav_task_state, type: swarm_uav_interfaces/UavTaskState, max_freq: 0}
  - {name: mavros/state, type: mavros_msgs/State, max_freq: 0}
  - {name: mavros/time_reference, type: sensor_msgs/TimeReference, max_freq: 0}
  # 限频理由（2026-09-22 实测）：机载本机侧这些话题是均匀的（GPS 50 Hz、pose 30 Hz），
  # 但四机同时经电台链路转发时链路拥塞，GCS 侧变成「几十条挤在一起 + 1~3 s 空档」的
  # 团块到达。后果：① GCS 标定节点要求 2 s 窗口内样本跨度 ≥1.9 s，实测八条流同时满足
  # 0/300，calibration_ready 永远为 False；② 跟随者领机 odom 超时是 1.0 s
  # （ego_swarm.py:65），空档会打 LEADER_LOST。
  # 限频只压「不需要满速率」的话题；trajectory_intent 与 uav_task_state 保持不限频
  # （规划层安全相关）。各值都留了最低需求余量，见每行注释。
  - {name: mavros/global_position/global, type: sensor_msgs/NavSatFix, max_freq: 5}   # 标定需 ≥2.5 Hz（2 s 窗口 ≥5 样本）
  - {name: mavros/local_position/pose, type: geometry_msgs/PoseStamped, max_freq: 10} # 标定 ≥2.5 Hz；GCS 取航向
  - {name: mavros/local_position/odom, type: nav_msgs/Odometry, max_freq: 20}         # 跟随者 PI 环 10 Hz（_FOLLOW_LOOP_HZ）
  - {name: mavros/rc/in, type: mavros_msgs/RCIn, max_freq: 1}                          # 仅供地面监视
  - {name: gp_origin_confirmed, type: std_msgs/Bool, max_freq: 0}
  - {name: trajectory_intent, type: swarm_uav_interfaces/UavTrajectoryIntent, max_freq: 0}
  - {name: gps_bias, type: std_msgs/Float64, max_freq: 0}
  - {name: group_a/gp_origin, type: geographic_msgs/GeoPointStamped, max_freq: 0}

max_freq: 0
base_port: 4200
service_base_port: 14000

# 每架 UAVn 的生产服务（本机 executor 注册，本机 bridge 绑定 ROUTER；其余节点代理）。
services:
